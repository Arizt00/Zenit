name: Bug report
description: Report a reproducible problem in Zénit.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version and revision
      placeholder: 0.5.4 R5
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and display scaling
      placeholder: Windows 11 x64, 150% DPI, two monitors
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the affected window, file type and runtime.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove private code, credentials and personal paths before attaching them.
